<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#111b30" stroke-width="1"/>
    </pattern>
    <linearGradient id="neon" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c1528"/><stop offset="1" stop-color="#080d1a"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter><radialGradient id="amb" cx="0.15" cy="0.1" r="0.8"><stop offset="0" stop-color="#6366f1" stop-opacity="0.16"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
    <clipPath id="frame"><rect width="1200" height="520" rx="18"/></clipPath>
  </defs>
  <style>
    .fi { opacity:0; animation: fi .7s ease-out forwards; }
    .dot { animation: blink 1.6s ease-in-out infinite; }
    @keyframes fi { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }
    @keyframes blink { 50% { opacity:.25; } }</style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="520" fill="#05070d"/>
    <rect width="1200" height="520" fill="url(#grid)"/>
    <rect width="1200" height="520" fill="url(#amb)"/>
    <text x="48" y="56" font-family="'SF Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="15" fill="#22d3ee" letter-spacing="3">&gt; SELECTED_WORK</text><line x1="211.5" y1="51" x2="1152" y2="51" stroke="#1e293b" stroke-width="1"/><g class="fi" style="animation-delay:0.15s"><rect x="48" y="86" width="540" height="190" rx="14" fill="url(#card)" stroke="#1e293b"/><rect x="48" y="108" width="3" height="40" rx="1.5" fill="url(#neon)"/><text x="560" y="138" text-anchor="end" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="40" font-weight="800" fill="#1e293b">01</text><text x="76" y="136" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff">Multi-Agent Health Coach</text><text x="76" y="172" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#94a3b8">AI assistant where specialist agents team up to</text><text x="76" y="194" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#94a3b8">coach users through their health goals.</text><rect x="76" y="220" width="61" height="28" rx="8" fill="#0b1324" stroke="url(#neon)" stroke-width="1"/><text x="106.5" y="238.55" text-anchor="middle" font-family="'SF Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="13" fill="#cbd5e1">LLMs</text><rect x="147" y="220" width="76" height="28" rx="8" fill="#0b1324" stroke="url(#neon)" stroke-width="1"/><text x="185.0" y="238.55" text-anchor="middle" font-family="'SF Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="13" fill="#cbd5e1">Agents</text><rect x="233" y="220" width="84" height="28" rx="8" fill="#0b1324" stroke="url(#neon)" stroke-width="1"/><text x="275.0" y="238.55" text-anchor="middle" font-family="'SF Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="13" fill="#cbd5e1">Node.js</text></g><g class="fi" style="animation-delay:0.3s"><rect x="612" y="86" width="540" height="190" rx="14" fill="url(#card)" stroke="#1e293b"/><rect x="612" y="108" width="3" height="40" rx="1.5" fill="url(#neon)"/><text x="1124" y="138" text-anchor="end" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="40" font-weight="800" fill="#1e293b">02</text><text x="640" y="136" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff">Clinical Voice Dictation</text><text x="640" y="172" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#94a3b8">Speech-to-text that turns spoken notes into</text><text x="640" y="194" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#94a3b8">structured medical reports.</text><rect x="640" y="220" width="139" height="28" rx="8" fill="#0b1324" stroke="url(#neon)" stroke-width="1"/><text x="709.5" y="238.55" text-anchor="middle" font-family="'SF Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="13" fill="#cbd5e1">Speech-to-Text</text><rect x="789" y="220" width="69" height="28" rx="8" fill="#0b1324" stroke="url(#neon)" stroke-width="1"/><text x="823.5" y="238.55" text-anchor="middle" font-family="'SF Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="13" fill="#cbd5e1">React</text><rect x="868" y="220" width="45" height="28" rx="8" fill="#0b1324" stroke="url(#neon)" stroke-width="1"/><text x="890.5" y="238.55" text-anchor="middle" font-family="'SF Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="13" fill="#cbd5e1">AI</text></g><g class="fi" style="animation-delay:0.44999999999999996s"><rect x="48" y="300" width="540" height="190" rx="14" fill="url(#card)" stroke="#1e293b"/><rect x="48" y="322" width="3" height="40" rx="1.5" fill="url(#neon)"/><text x="560" y="352" text-anchor="end" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="40" font-weight="800" fill="#1e293b">03</text><text x="76" y="350" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff">Real-time Messaging Platform</text><text x="76" y="386" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#94a3b8">Chat infrastructure designed for massive</text><text x="76" y="408" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#94a3b8">concurrency and instant delivery.</text><rect x="76" y="434" width="108" height="28" rx="8" fill="#0b1324" stroke="url(#neon)" stroke-width="1"/><text x="130.0" y="452.55" text-anchor="middle" font-family="'SF Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="13" fill="#cbd5e1">WebSockets</text><rect x="194" y="434" width="69" height="28" rx="8" fill="#0b1324" stroke="url(#neon)" stroke-width="1"/><text x="228.5" y="452.55" text-anchor="middle" font-family="'SF Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="13" fill="#cbd5e1">Redis</text><rect x="273" y="434" width="69" height="28" rx="8" fill="#0b1324" stroke="url(#neon)" stroke-width="1"/><text x="307.5" y="452.55" text-anchor="middle" font-family="'SF Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="13" fill="#cbd5e1">Scale</text></g><g class="fi" style="animation-delay:0.6s"><rect x="612" y="300" width="540" height="190" rx="14" fill="url(#card)" stroke="#1e293b"/><rect x="612" y="322" width="3" height="40" rx="1.5" fill="url(#neon)"/><text x="1124" y="352" text-anchor="end" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="40" font-weight="800" fill="#1e293b">04</text><text x="640" y="350" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff">Cloud Platform Migration</text><text x="640" y="386" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#94a3b8">Moved a full production stack to a new</text><text x="640" y="408" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#94a3b8">cloud setup, safely and on schedule.</text><rect x="640" y="434" width="53" height="28" rx="8" fill="#0b1324" stroke="url(#neon)" stroke-width="1"/><text x="666.5" y="452.55" text-anchor="middle" font-family="'SF Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="13" fill="#cbd5e1">GCP</text><rect x="703" y="434" width="76" height="28" rx="8" fill="#0b1324" stroke="url(#neon)" stroke-width="1"/><text x="741.0" y="452.55" text-anchor="middle" font-family="'SF Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="13" fill="#cbd5e1">DevOps</text><rect x="789" y="434" width="69" height="28" rx="8" fill="#0b1324" stroke="url(#neon)" stroke-width="1"/><text x="823.5" y="452.55" text-anchor="middle" font-family="'SF Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="13" fill="#cbd5e1">CI/CD</text></g>
    <path d="M14,32 L14,14 L32,14" stroke="#22d3ee" stroke-width="2" fill="none" opacity="0.7"/><path d="M1186,32 L1186,14 L1168,14" stroke="#22d3ee" stroke-width="2" fill="none" opacity="0.7"/><path d="M14,488 L14,506 L32,506" stroke="#22d3ee" stroke-width="2" fill="none" opacity="0.7"/><path d="M1186,488 L1186,506 L1168,506" stroke="#22d3ee" stroke-width="2" fill="none" opacity="0.7"/>
    <rect x="1" y="1" width="1198" height="518" rx="18" fill="none" stroke="#1e293b" stroke-width="2"/>
  </g>
</svg>