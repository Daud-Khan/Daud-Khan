10" fill="url(#card)" stroke="#1e293b"/><circle class="dot" style="animation-delay:1.2000000000000002s" cx="58" cy="265" r="5" fill="#22c55e" filter="url(#glow)"/><text x="76" y="271" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#e2e8f0">Exploring LLM orchestration</text><text x="538" y="271" text-anchor="end" font-family="'SF Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="12" fill="#64748b">ACTIVE</text></g>
