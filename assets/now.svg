<svg xmlns="http://www.w3.org/2000/svg" width="590" height="360" viewBox="0 0 590 360">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#111b30" stroke-width="1"/>
    </pattern>
    <linearGradient id="neon" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c1528"/><stop offset="1" stop-color="#080d1a"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter><radialGradient id="amb" cx="0.15" cy="0.1" r="0.8"><stop offset="0" stop-color="#6366f1" stop-opacity="0.16"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
    <clipPath id="frame"><rect width="590" height="360" rx="18"/></clipPath>
  </defs>
  <style>
