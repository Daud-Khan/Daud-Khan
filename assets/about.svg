    <path d="M14,32 L14,14 L32,14" stroke="#22d3ee" stroke-width="2" fill="none" opacity="0.7"/><path d="M576,32 L576,14 L558,14" stroke="#22d3ee" stroke-width="2" fill="none" opacity="0.7"/><path d="M14,328 L14,346 L32,346" stroke="#22d3ee" stroke-width="2" fill="none" opacity="0.7"/><path d="M576,328 L576,346 L558,346" stroke="#22d3ee" stroke-width="2" fill="none" opacity="0.7"/>
    <rect x="1" y="1" width="588" height="358" rx="18" fill="none" stroke="#1e293b" stroke-width="2"/>
