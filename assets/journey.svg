<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#111b30" stroke-width="1"/>
    </pattern>
    <linearGradient id="neon" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c1528"/><stop offset="1" stop-color="#080d1a"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter><radialGradient id="amb" cx="0.15" cy="0.1" r="0.8"><stop offset="0" stop-color="#6366f1" stop-opacity="0.16"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
    <clipPath id="frame"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>
  <style>
    .fi { opacity:0; animation: fi .7s ease-out forwards; }
    .dot { animation: blink 1.6s ease-in-out infinite; }
    @keyframes fi { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }
    @keyframes blink { 50% { opacity:.25; } }
    .draw { animation: draw 2.2s ease-out .2s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }</style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="#05070d"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <rect width="1200" height="300" fill="url(#amb)"/>
    <text x="48" y="56" font-family="'SF Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="15" fill="#22d3ee" letter-spacing="3">&gt; JOURNEY</text><line x1="154.5" y1="51" x2="1152" y2="51" stroke="#1e293b" stroke-width="1"/><line x1="110" y1="160" x2="1090" y2="160" stroke="#1e293b" stroke-width="3"/><line class="draw" x1="110" y1="160" x2="1090" y2="160" stroke="url(#neon)" stroke-width="3" stroke-dasharray="980" stroke-dashoffset="980"/><circle r="5" fill="#ffffff" filter="url(#glow)"><animateMotion dur="5s" begin="2s" repeatCount="indefinite" path="M110,160 L1090,160"/></circle><g class="fi" style="animation-delay:0.3s"><text x="110.0" y="126" text-anchor="middle" font-family="'SF Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="14" font-weight="700" fill="#22d3ee" letter-spacing="2">2018</text><circle cx="110.0" cy="160" r="12" fill="#05070d" stroke="#22d3ee" stroke-width="2"/><circle cx="110.0" cy="160" r="5" fill="#22d3ee" filter="url(#glow)"/><text x="110.0" y="208" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#ffffff">First commit</text><text x="110.0" y="232" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#94a3b8">Started building for the web</text></g><g class="fi" style="animation-delay:0.6499999999999999s"><text x="355.0" y="126" text-anchor="middle" font-family="'SF Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="14" font-weight="700" fill="#22d3ee" letter-spacing="2">2019</text><circle cx="355.0" cy="160" r="12" fill="#05070d" stroke="#22d3ee" stroke-width="2"/><circle cx="355.0" cy="160" r="5" fill="#22d3ee" filter="url(#glow)"/><text x="355.0" y="208" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#ffffff">Joined Productbox</text><text x="355.0" y="232" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#94a3b8">Full-stack product work</text></g><g class="fi" style="animation-delay:1.0s"><text x="600.0" y="126" text-anchor="middle" font-family="'SF Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="14" font-weight="700" fill="#22d3ee" letter-spacing="2">GROWTH</text><circle cx="600.0" cy="160" r="12" fill="#05070d" stroke="#22d3ee" stroke-width="2"/><circle cx="600.0" cy="160" r="5" fill="#22d3ee" filter="url(#glow)"/><text x="600.0" y="208" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#ffffff">Cloud &amp; scale</text><text x="600.0" y="232" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#94a3b8">Infra, DevOps, performance</text></g><g class="fi" style="animation-delay:1.3499999999999999s"><text x="845.0" y="126" text-anchor="middle" font-family="'SF Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="14" font-weight="700" fill="#22d3ee" letter-spacing="2">LEAD</text><circle cx="845.0" cy="160" r="12" fill="#05070d" stroke="#22d3ee" stroke-width="2"/><circle cx="845.0" cy="160" r="5" fill="#22d3ee" filter="url(#glow)"/><text x="845.0" y="208" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#ffffff">Engineering Lead</text><text x="845.0" y="232" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#94a3b8">Teams, clients, delivery</text></g><g class="fi" style="animation-delay:1.7s"><text x="1090.0" y="126" text-anchor="middle" font-family="'SF Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="14" font-weight="700" fill="#22c55e" letter-spacing="2">NOW</text><circle cx="1090.0" cy="160" r="12" fill="#05070d" stroke="#22c55e" stroke-width="2"/><circle cx="1090.0" cy="160" r="5" fill="#22c55e" filter="url(#glow)"/><text x="1090.0" y="208" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#ffffff">AI in production</text><text x="1090.0" y="232" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#94a3b8">Agents, LLMs, voice AI</text></g><circle cx="1090.0" cy="160" r="12" fill="none" stroke="#22c55e" stroke-width="1.5"><animate attributeName="r" values="12;26" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0" dur="2s" repeatCount="indefinite"/></circle>
    <path d="M14,32 L14,14 L32,14" stroke="#22d3ee" stroke-width="2" fill="none" opacity="0.7"/><path d="M1186,32 L1186,14 L1168,14" stroke="#22d3ee" stroke-width="2" fill="none" opacity="0.7"/><path d="M14,268 L14,286 L32,286" stroke="#22d3ee" stroke-width="2" fill="none" opacity="0.7"/><path d="M1186,268 L1186,286 L1168,286" stroke="#22d3ee" stroke-width="2" fill="none" opacity="0.7"/>
    <rect x="1" y="1" width="1198" height="298" rx="18" fill="none" stroke="#1e293b" stroke-width="2"/>
  </g>
</svg>